name: agentfolio
description: "Agentfolio — portfolio analytics, research and an AI trading assistant for your broker account."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  animations: ^3.0.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  cookie_jar: ^4.0.9
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  logging: ^1.3.0
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2

dev_dependencies:
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  # Native flavor used when `--flavor` is omitted. Matches Env's prod fallback.
  default-flavor: prod

# Native launch screen: the background colour only. The animated splash
# (lib/app/splash) draws the logo from nothing on that same colour, so the
# hand-off from native to Flutter is invisible. Android 12+ always shows an
# icon in its system splash, hence the transparent one.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F172A"
  android_12:
    color: "#0F172A"
    image: assets/splash/android12_blank.png
  web: false
